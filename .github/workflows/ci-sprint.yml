name: CI sprint branches

on:
  pull_request:
    branches:
      - sprint/F135-work-talk-1.1
      - sprint/F141-work-talk-1.2
    paths:
      - '.github/workflows/ci-sprint.yml'
      - '.github/workflows/test.yml'
      - '**.go'
      - 'go.*'
      - 'Makefile'
  push:
    branches:
      - sprint/F135-work-talk-1.1
      - sprint/F141-work-talk-1.2
    paths:
      - '.github/workflows/ci-sprint.yml'
      - '.github/workflows/test.yml'
      - '**.go'
      - 'go.*'
      - 'Makefile'

permissions:
  contents: read

jobs:
  go:
    env:
      MAXMIND_GEOLITE2_LICENSE: ${{ secrets.MAXMIND_GEOLITE2_LICENSE }}
      USE_DB_IP_GEOIP_DATABASE: "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build applications
        run: |
          echo "Building with $(nproc) threads"
          make client -j$(nproc)
          make proxy -j$(nproc)
          make server -j$(nproc)

      - name: Run tests
        run: make test TIMEOUT=120s

name: Publish work-talk signaling image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (e.g. 2.1.1-work-talk-1.2)
        required: true
        default: "2.1.1-work-talk-1.2"
        type: string
  push:
    tags:
      - "work-talk-*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: softwarebeesy/nextcloud-spreed-signaling

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Resolve image tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.image_tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "value=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Resolved tag: ${tag}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: prep
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          set -euo pipefail
          tags="ghcr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          push_dockerhub="false"
          if [[ -n "${DOCKER_HUB_USER}" ]]; then
            tags="${tags}"$'\n'"docker.io/${IMAGE_NAME}:${IMAGE_TAG}"
            push_dockerhub="true"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
            echo "push_dockerhub=${push_dockerhub}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        if: steps.prep.outputs.push_dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=nextcloud-spreed-signaling
            org.opencontainers.image.description=SoftwareBeesy work-talk signaling server fork

      - name: Job summary
        shell: bash
        env:
          PUSH_DOCKERHUB: ${{ steps.prep.outputs.push_dockerhub }}
        run: |
          {
            echo "## Published work-talk signaling image"
            echo ""
            echo "- **Tag**: \`${{ steps.tag.outputs.value }}\`"
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **GHCR**: \`ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}\`"
            echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`"
            if [[ "${PUSH_DOCKERHUB}" == "true" ]]; then
              echo "- **Docker Hub**: \`docker.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
